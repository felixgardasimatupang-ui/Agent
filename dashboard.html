<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Swarm Orchestrator</title>
<style>
:root {
  --bg: #0b0f19; --surface: #111827; --border: #1f2937;
  --cyan: #00f0ff; --green: #22c55e; --yellow: #eab308;
  --red: #ef4444; --blue: #38bdf8; --purple: #a78bfa;
  --gray: #6b7280; --text: #e5e7eb; --muted: #9ca3af;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; line-height: 1.5; }
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }

/* Header */
.header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
.header h1 { font-size: 1.1em; color: var(--cyan); letter-spacing: 3px; font-weight: 600; }
.header .status { display: flex; align-items: center; gap: 6px; font-size: 0.8em; color: var(--muted); }
.header .dot { width: 8px; height: 8px; border-radius: 50%; }
.header .dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
.header .dot.off { background: var(--red); }
.stats { display: flex; gap: 16px; font-size: 0.75em; color: var(--muted); }
.stats b { color: var(--cyan); }

/* Input */
.input-area { margin-bottom: 24px; }
.input-row { display: flex; gap: 10px; }
.input-row textarea { flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 14px; border-radius: 8px; font-family: inherit; font-size: 0.9em; resize: vertical; min-height: 56px; transition: border-color 0.2s; }
.input-row textarea:focus { outline: none; border-color: var(--cyan); }
.input-row textarea::placeholder { color: var(--gray); }
.input-controls { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
.input-controls select { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; font-family: inherit; font-size: 0.8em; }
.run-btn { background: var(--cyan); color: var(--bg); border: none; padding: 8px 20px; border-radius: 6px; font-family: inherit; font-weight: 600; font-size: 0.85em; cursor: pointer; transition: all 0.15s; }
.run-btn:hover { filter: brightness(1.1); }
.run-btn:disabled { background: var(--gray); cursor: not-allowed; }

/* Prompt echo */
.prompt-echo { background: var(--surface); border-left: 3px solid var(--cyan); padding: 10px 14px; margin-bottom: 20px; font-size: 0.85em; color: var(--muted); border-radius: 0 6px 6px 0; display: none; }
.prompt-echo.show { display: block; }
.prompt-echo b { color: var(--cyan); margin-right: 6px; }

/* Result */
.result { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 24px; display: none; }
.result.show { display: block; }
.result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.result-header h3 { font-size: 0.9em; font-weight: 600; }
.result-header h3.ok { color: var(--green); }
.result-header h3.err { color: var(--red); }
.result-stats { display: flex; gap: 12px; font-size: 0.75em; color: var(--muted); }
.result-stats span { background: rgba(255,255,255,0.04); padding: 3px 10px; border-radius: 4px; }
.result-body { background: #0d1117; border-radius: 8px; padding: 16px; font-size: 0.85em; line-height: 1.7; white-space: pre-wrap; word-break: break-word; max-height: 500px; overflow-y: auto; border: 1px solid var(--border); }
.result-body code { color: var(--cyan); }
.result-body pre { margin: 0; }

/* Agent breakdown */
.breakdown { margin-top: 16px; }
.breakdown-toggle { background: none; border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; border-radius: 6px; font-family: inherit; font-size: 0.75em; cursor: pointer; transition: all 0.15s; }
.breakdown-toggle:hover { border-color: var(--cyan); color: var(--cyan); }
.breakdown-table { width: 100%; border-collapse: collapse; font-size: 0.78em; margin-top: 12px; }
.breakdown-table th { text-align: left; color: var(--gray); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 0.9em; }
.breakdown-table td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.03); vertical-align: top; }
.breakdown-table tr:last-child td { border-bottom: none; }
.breakdown-table .cell-task { color: var(--text); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.breakdown-table .cell-type { color: var(--purple); font-size: 0.9em; font-weight: 500; }
.breakdown-table .cell-time { color: var(--gray); white-space: nowrap; }
.breakdown-table .cell-out { color: var(--muted); max-width: 350px; max-height: 48px; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
.breakdown-table .cell-ok { color: var(--green); }
.breakdown-table .cell-err { color: var(--red); }

/* Agent Grid */
.section-label { font-size: 0.75em; letter-spacing: 2px; color: var(--gray); text-transform: uppercase; margin: 24px 0 12px; font-weight: 500; }
.agent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; margin-bottom: 24px; }
.agent-card { border: 1px solid var(--border); padding: 10px 12px; border-radius: 8px; background: var(--surface); transition: all 0.2s; }
.agent-card .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.agent-card .aid { font-size: 0.65em; color: var(--gray); }
.agent-card .atype { font-size: 0.65em; color: var(--purple); font-weight: 500; text-transform: uppercase; }
.agent-card .task { font-size: 0.78em; color: var(--text); line-height: 1.3; max-height: 36px; overflow: hidden; text-overflow: ellipsis; }
.agent-card .meta { font-size: 0.65em; color: var(--gray); margin-top: 4px; }
.agent-card.IDLE { opacity: 0.5; }
.agent-card.INITIALIZING { border-color: var(--yellow); }
.agent-card.PROCESSING { border-color: var(--blue); animation: pulse 1.5s infinite; }
.agent-card.COMPLETE { border-color: var(--green); }
.agent-card.FAILED { border-color: var(--red); }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.7; } }

/* History */
.hist { width: 100%; border-collapse: collapse; font-size: 0.78em; }
.hist th { text-align: left; color: var(--gray); font-weight: 500; padding: 8px; border-bottom: 1px solid var(--border); }
.hist td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.03); }
.badge { padding: 2px 8px; border-radius: 4px; font-size: 0.85em; }
.badge-ok { background: rgba(34,197,94,0.12); color: var(--green); }
.badge-err { background: rgba(239,68,68,0.12); color: var(--red); }

/* Logs */
.logs { background: #000; border: 1px solid var(--border); border-radius: 8px; padding: 10px; max-height: 160px; overflow-y: auto; font-size: 0.72em; line-height: 1.6; font-family: 'JetBrains Mono', monospace; }
.logs .l { color: var(--muted); }
.logs .l.i { color: var(--cyan); }
.logs .l.w { color: var(--yellow); }
.logs .l.e { color: var(--red); }

@media (max-width: 768px) {
  .agent-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .header { flex-direction: column; align-items: flex-start; gap: 8px; }
  .input-row { flex-direction: column; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>SWARM ORCHESTRATOR</h1>
    <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
      <div class="status"><span class="dot ok" id="ws-dot"></span><span id="ws-label">Connected</span></div>
      <div class="stats">
        <span>Agents <b id="s-agents">0</b></span>
        <span>Tasks <b id="s-tasks">0</b></span>
        <span>Up <b id="s-uptime">-</b></span>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="inp" placeholder="What do you need?"></textarea>
    </div>
    <div class="input-controls">
      <select id="strat">
        <option value="best">Best</option>
        <option value="concatenate">Concatenate</option>
        <option value="vote">Vote</option>
      </select>
      <button class="run-btn" id="run-btn" onclick="run()">RUN</button>
    </div>
  </div>

  <div class="prompt-echo" id="echo"><b>></b> <span id="echo-text"></span></div>

  <div class="result" id="result">
    <div class="result-header">
      <h3 id="r-title" class="ok">Result</h3>
      <div class="result-stats">
        <span id="r-time"></span>
        <span id="r-agents"></span>
        <span id="r-strat"></span>
      </div>
    </div>
    <div class="result-body" id="r-body"></div>
    <div class="breakdown" id="bd" style="display:none">
      <button class="breakdown-toggle" onclick="toggleBD()">Show agent breakdown</button>
      <table class="breakdown-table" id="bd-table" style="display:none">
        <thead><tr><th>#</th><th>Task</th><th>Type</th><th>Time</th><th>Output</th></tr></thead>
        <tbody id="bd-body"></tbody>
      </table>
    </div>
  </div>

  <div class="section-label">Agents</div>
  <div class="agent-grid" id="grid"></div>

  <div class="section-label">History</div>
  <table class="hist">
    <thead><tr><th>ID</th><th>Prompt</th><th>Status</th><th>Time</th></tr></thead>
    <tbody id="hist-body"></tbody>
  </table>

  <div class="section-label">Log</div>
  <div class="logs" id="logs"></div>
</div>

<script>
const API = location.origin;
let ws, count = 0;
const agents = {};

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { dot(true); log('connected', 'i'); };
  ws.onclose = () => { dot(false); setTimeout(connect, 2000); };
  ws.onerror = () => ws.close();
  ws.onmessage = e => { const d = JSON.parse(e.data); if (d.type === 'agent_update') update(d); };
}

function dot(ok) {
  document.getElementById('ws-dot').className = 'dot ' + (ok ? 'ok' : 'off');
  document.getElementById('ws-label').textContent = ok ? 'Connected' : 'Disconnected';
}

function update(d) {
  agents[d.agent_id] = d;
  render();
}

function render() {
  const g = document.getElementById('grid');
  const list = Object.values(agents);
  document.getElementById('s-agents').textContent = list.length;
  g.innerHTML = list.map(a => {
    const t = a.instruction || a.task || a.output || '';
    const clean = t.replace(/ORIGINAL USER REQUEST:[\s\S]*?YOUR SPECIFIC TASK:\n?/m, '').trim();
    const display = clean ? esc(trunc(clean, 80)) : `<span style="color:var(--gray)">${a.status||'IDLE'}</span>`;
    return `<div class="agent-card ${a.status||'IDLE'}">
      <div class="top"><span class="aid">#${a.agent_id}</span><span class="atype">${(a.agent_type||'').toUpperCase()}</span></div>
      <div class="task">${display}</div>
      <div class="meta">${a.elapsed ? a.elapsed.toFixed(1)+'s' : ''}</div>
    </div>`;
  }).join('');
}

function showResult(d) {
  const p = document.getElementById('result');
  p.classList.add('show');
  const ok = (d.success_count||0) > 0;
  document.getElementById('r-title').textContent = ok ? 'Result' : 'No Result';
  document.getElementById('r-title').className = ok ? 'ok' : 'err';

  // Clean the output — strip **Best Result (...)** prefix
  let raw = d.final_output || 'No output';
  raw = raw.replace(/^\*\*Best Result \(Agent \d+, \w+\):\*\*\n*/i, '');
  raw = raw.replace(/^\*\*Consensus Result.*?\*\*\n*/i, '');
  document.getElementById('r-body').textContent = raw;

  document.getElementById('r-time').textContent = (d.total_time||0).toFixed(1) + 's';
  document.getElementById('r-agents').textContent = (d.success_count||0) + '/' + ((d.success_count||0)+(d.failure_count||0));
  document.getElementById('r-strat').textContent = d.strategy || 'best';

  // Breakdown
  const ar = d.agent_results || [];
  if (ar.length) {
    document.getElementById('bd').style.display = 'block';
    document.getElementById('bd-body').innerHTML = ar.map(r => {
      const task = (r.instruction||'').replace(/ORIGINAL USER REQUEST:[\s\S]*?YOUR SPECIFIC TASK:\n?/m, '').trim();
      const out = r.output || r.error || '';
      return `<tr>
        <td class="${r.status==='SUCCESS'?'cell-ok':'cell-err'}">#${r.agent_id}</td>
        <td class="cell-task" title="${esc(task)}">${esc(trunc(task,50))}</td>
        <td class="cell-type">${(r.agent_type||'').toUpperCase()}</td>
        <td class="cell-time">${r.execution_time?.toFixed(1)||'-'}s</td>
        <td class="cell-out" title="${esc(out)}">${esc(trunc(out,100))}</td>
      </tr>`;
    }).join('');
    // Update grid with final data
    ar.forEach(r => {
      agents[r.agent_id] = {...agents[r.agent_id], agent_type:r.agent_type, instruction:r.instruction,
        status:r.status==='SUCCESS'?'COMPLETE':'FAILED', output:r.output, elapsed:r.execution_time};
    });
    render();
  }

  document.getElementById('run-btn').disabled = false;
  document.getElementById('run-btn').textContent = 'RUN';
  count++;
  document.getElementById('s-tasks').textContent = count;
}

function toggleBD() {
  const t = document.getElementById('bd-table');
  const b = document.querySelector('.breakdown-toggle');
  if (t.style.display === 'none') { t.style.display = 'table'; b.textContent = 'Hide breakdown'; }
  else { t.style.display = 'none'; b.textContent = 'Show agent breakdown'; }
}

async function run() {
  const prompt = document.getElementById('inp').value.trim();
  if (!prompt) return;
  const btn = document.getElementById('run-btn');
  btn.disabled = true; btn.textContent = '...';

  document.getElementById('echo').classList.add('show');
  document.getElementById('echo-text').textContent = prompt;
  document.getElementById('result').classList.remove('show');
  document.getElementById('bd-table').style.display = 'none';
  for (const k in agents) delete agents[k];
  render();

  try {
    const r = await fetch(`${API}/v1/swarm/execute`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ prompt, strategy: document.getElementById('strat').value, agents: 5 })
    });
    const d = await r.json();
    if (d.task_id) showResult({...d, strategy: document.getElementById('strat').value});
    else { log('Error: ' + (d.detail||'Unknown'), 'e'); btn.disabled=false; btn.textContent='RUN'; }
  } catch(e) { log('Error: '+e.message, 'e'); btn.disabled=false; btn.textContent='RUN'; }
}

function log(m, c='') {
  const p = document.getElementById('logs');
  const t = new Date().toLocaleTimeString();
  p.innerHTML += `<div class="l ${c}">[${t}] ${esc(m)}</div>`;
  p.scrollTop = p.scrollHeight;
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function trunc(s, n) { return s.length > n ? s.slice(0,n)+'…' : s; }

setInterval(() => {
  const el = document.getElementById('s-uptime');
  if (!el.dataset.s) {
    fetch(`${API}/health`).then(r=>r.json()).then(d=>{ el.dataset.s = Date.now() - d.uptime_seconds*1000; }).catch(()=>{});
  } else {
    const s = Math.floor((Date.now()-parseInt(el.dataset.s))/1000);
    const m = Math.floor(s/60), h = Math.floor(m/60);
    el.textContent = h ? `${h}h${m%60}m` : m ? `${m}m${s%60}s` : `${s}s`;
  }
}, 1000);

async function loadHist() {
  try {
    const r = await fetch(`${API}/v1/swarm/tasks`);
    const d = await r.json();
    const t = d.tasks || d || [];
    document.getElementById('hist-body').innerHTML = t.slice(0,8).map(x => `<tr>
      <td style="color:var(--gray)">${(x.task_id||'').slice(0,8)}</td>
      <td>${esc(trunc(x.prompt||'',40))}</td>
      <td><span class="badge badge-${x.status==='completed'?'ok':'err'}">${x.status||'?'}</span></td>
      <td style="color:var(--gray)">${x.total_time ? x.total_time.toFixed(1)+'s' : '-'}</td>
    </tr>`).join('');
  } catch(e) {}
}

connect(); loadHist(); setInterval(loadHist, 15000);
</script>
</body>
</html>
